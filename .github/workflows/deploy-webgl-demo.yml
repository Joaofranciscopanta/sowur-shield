name: Deploy WebGL Demo to GitHub Pages

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly deployment (Sunday 3 AM UTC)

  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unity Cloud Build number (leave empty for latest)'
        required: false
        default: ''
      skip_verification:
        description: 'Skip build verification (not recommended)'
        required: false
        type: boolean
        default: false

  repository_dispatch:
    types: [unity-build-complete]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webgl-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Download and Deploy WebGL Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🎮 Download Unity Cloud Build
        id: download_build
        env:
          UNITY_API_KEY: ${{ secrets.UNITY_API_KEY }}
          UNITY_ORG_ID: ${{ secrets.UNITY_ORG_ID }}
          UNITY_PROJECT_ID: ${{ secrets.UNITY_PROJECT_ID }}
          UNITY_BUILD_TARGET_ID: ${{ secrets.UNITY_BUILD_TARGET_ID }}
        run: |
          echo "Downloading latest Unity Cloud Build..."
          mkdir -p temp_build
          ENCODED_KEY=$(echo -n "$UNITY_API_KEY:" | base64)

          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            echo "Fetching latest build number..."
            BUILD_INFO=$(curl -s -H "Authorization: Basic $ENCODED_KEY" \
              "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${UNITY_BUILD_TARGET_ID}/builds?per_page=1&buildStatus=success")

            BUILD_NUMBER=$(echo "$BUILD_INFO" | grep -o '"build":[0-9]*' | head -1 | cut -d':' -f2)

            if [ -z "$BUILD_NUMBER" ]; then
              echo "❌ Error: Could not fetch latest build number"
              echo "Response: $BUILD_INFO"
              exit 1
            fi

            echo "✅ Latest successful build: #$BUILD_NUMBER"
          else
            echo "Using specified build number: #$BUILD_NUMBER"
          fi

          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          echo "Fetching download URL..."
          DOWNLOAD_INFO=$(curl -s -H "Authorization: Basic $ENCODED_KEY" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${UNITY_BUILD_TARGET_ID}/builds/${BUILD_NUMBER}")

          DOWNLOAD_URL=$(echo "$DOWNLOAD_INFO" | grep -o '"download_primary"[^}]*"href":"[^"]*"' | grep -o 'https://[^"]*' | head -1)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ Error: Could not fetch download URL"
            echo "Response: $DOWNLOAD_INFO"
            exit 1
          fi

          echo "✅ Download URL found"

          echo "Downloading build archive..."
          HTTP_CODE=$(curl -L -w "%{http_code}" \
            -H "Authorization: Basic $ENCODED_KEY" \
            "$DOWNLOAD_URL" \
            -o temp_build/webgl-build.zip \
            --connect-timeout 30 \
            --max-time 600)

          echo "HTTP Response Code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Error: Download failed with HTTP status $HTTP_CODE"
            echo "File content (first 50 lines):"
            head -n 50 temp_build/webgl-build.zip
            exit 1
          fi

          if [ ! -f "temp_build/webgl-build.zip" ]; then
            echo "❌ Error: Build file not created"
            exit 1
          fi

          BUILD_SIZE_BYTES=$(stat -c%s "temp_build/webgl-build.zip" 2>/dev/null || stat -f%z "temp_build/webgl-build.zip" 2>/dev/null)
          echo "Downloaded file size: $BUILD_SIZE_BYTES bytes"

          if [ "$BUILD_SIZE_BYTES" -lt 1048576 ]; then
            echo "❌ Error: Downloaded file is too small ($BUILD_SIZE_BYTES bytes)"
            echo "This likely means an error response was downloaded instead of the build"
            echo "File content:"
            head -n 100 temp_build/webgl-build.zip
            exit 1
          fi

          FILE_TYPE=$(file temp_build/webgl-build.zip)
          echo "File type: $FILE_TYPE"

          if [[ ! "$FILE_TYPE" == *"Zip archive"* ]] && [[ ! "$FILE_TYPE" == *"zip"* ]]; then
            echo "❌ Error: Downloaded file is not a valid ZIP archive"
            echo "File type detected: $FILE_TYPE"
            echo "File content (first 100 lines):"
            head -n 100 temp_build/webgl-build.zip
            exit 1
          fi

          echo "Testing ZIP integrity..."
          if ! unzip -t temp_build/webgl-build.zip > /dev/null 2>&1; then
            echo "❌ Error: ZIP file is corrupted or invalid"
            echo "File details:"
            ls -lh temp_build/webgl-build.zip
            echo "Attempting to show ZIP contents:"
            unzip -l temp_build/webgl-build.zip || true
            exit 1
          fi

          BUILD_SIZE=$(du -h temp_build/webgl-build.zip | cut -f1)
          echo "✅ Build downloaded successfully ($BUILD_SIZE)"
          echo "✅ ZIP integrity verified"
          echo "download_success=true" >> $GITHUB_OUTPUT

      - name: 📦 Extract Unity Build
        run: |
          echo "Extracting Unity build archive..."
          cd temp_build
          unzip -q webgl-build.zip

          echo "Looking for WebGL build folder..."
          WEBGL_FOLDER=$(find . -maxdepth 2 -type d \( -iname "*webgl*" -o -iname "*WebGL*" \) ! -name "." | head -1)

          if [ -z "$WEBGL_FOLDER" ]; then
            echo "WebGL folder not found by name, checking for Build folder structure..."
            ls -la

            if [ -d "Build" ]; then
              WEBGL_FOLDER="."
              echo "Found WebGL build in root"
            else
              echo "❌ Error: Could not locate WebGL build structure"
              echo "Available folders:"
              find . -maxdepth 2 -type d
              exit 1
            fi
          else
            echo "Found WebGL build at: $WEBGL_FOLDER"
          fi

          cd ..
          rm -rf docs_new
          mkdir -p docs_new

          if [ "$WEBGL_FOLDER" = "." ]; then
            echo "Copying from temp_build root..."
            cp -r temp_build/* docs_new/
            rm -f docs_new/webgl-build.zip
          else
            echo "Copying from $WEBGL_FOLDER..."
            cp -r "temp_build/$WEBGL_FOLDER"/* docs_new/
          fi

          echo "✅ Build extracted to docs_new/"
          ls -la docs_new/

      - name: 📦 Decompress Brotli Files
        run: |
          echo "Checking for Brotli-compressed files..."
          sudo apt-get update -qq
          sudo apt-get install -y brotli

          if [ -d "docs_new/Build" ]; then
            while IFS= read -r -d '' BR_FILE; do
              DECOMPRESSED_FILE="${BR_FILE%.br}"
              echo "  Decompressing: $(basename "$BR_FILE") -> $(basename "$DECOMPRESSED_FILE")"
              brotli -d "$BR_FILE" -o "$DECOMPRESSED_FILE"
              rm "$BR_FILE"
              echo "  ✅ $(basename "$DECOMPRESSED_FILE")"
            done < <(find docs_new/Build -name "*.br" -type f -print0)

            if [ -n "$(find docs_new/Build -name "*.br" -type f)" ]; then
              echo "✅ All Brotli files decompressed successfully"
            elif [ -n "$(find docs_new/Build -name "*.data" -o -name "*.wasm" -o -name "*.framework.js" 2>/dev/null | head -1)" ]; then
              echo "✅ Build files already decompressed or use different compression"
            else
              echo "ℹ️  No Brotli files found, build may use gzip or uncompressed format"
            fi

            echo "Updating Unity loader configuration..."
            if [ -f "docs_new/index.html" ]; then
              sed -i 's/\.br"/"/g' docs_new/index.html
              sed -i "s/\.br'/'/g" docs_new/index.html
              echo "  ✅ Updated index.html to reference decompressed files"
            fi

            LOADER_FILE=$(find docs_new/Build -name "*.loader.js" -type f | head -1)
            if [ -n "$LOADER_FILE" ]; then
              if grep -q '\.br' "$LOADER_FILE"; then
                sed -i 's/\.br"/"/g' "$LOADER_FILE"
                sed -i "s/\.br'/'/g" "$LOADER_FILE"
                echo "  ✅ Updated loader.js to reference decompressed files"
              fi
            fi

            echo "✅ Loader configuration updated for decompressed builds"
          fi

      - name: 🎨 Restore Custom CSS
        run: |
          echo "Restoring custom sidebar CSS..."
          if [ -f ".github/scripts/restore-css.sh" ]; then
            ./.github/scripts/restore-css.sh .github/templates/style.css docs_new/TemplateData/style.css
          else
            echo "⚠️ Warning: restore-css.sh script not found, skipping custom CSS"
          fi

      - name: 📝 Inject Release Notes Sidebar
        run: |
          echo "Injecting release notes sidebar into index.html..."

          if [ ! -f "docs_new/index.html" ]; then
            echo "❌ ERROR: index.html not found"
            exit 1
          fi

          if grep -q 'id="release-notes"' docs_new/index.html; then
            echo "ℹ️  Sidebar already present in index.html, skipping injection"
          else
            if [ -f ".github/templates/sidebar.html" ]; then
              echo "  Injecting sidebar HTML from template..."
              SIDEBAR_HTML=$(cat .github/templates/sidebar.html)
              awk -v sidebar="$SIDEBAR_HTML" '
                /<body>/ {
                  print
                  print sidebar
                  next
                }
                { print }
              ' docs_new/index.html > docs_new/index.html.tmp
              mv docs_new/index.html.tmp docs_new/index.html
              echo "  ✅ Sidebar HTML injected successfully"
            else
              echo "⚠️ Warning: sidebar.html template not found, skipping sidebar injection"
            fi
          fi

      - name: 🔢 Inject Build Number
        run: |
          BUILD_NUM="${{ steps.download_build.outputs.build_number }}"
          DEPLOY_DATE=$(date +"%B %Y")
          DEPLOY_TIMESTAMP=$(date +"%Y-%m-%d %H:%M UTC")

          echo "Injecting build number #$BUILD_NUM into index.html..."

          sed -i "s|<div class=\"version\">Version 1.0 - October 2024</div>|<div class=\"version\">Build #$BUILD_NUM - $DEPLOY_DATE</div>|" docs_new/index.html

          sed -i "s|</body>|<!-- Unity Cloud Build #$BUILD_NUM - Deployed: $DEPLOY_TIMESTAMP -->\n  <div id=\"build-info\" style=\"position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-family: monospace; z-index: 10000;\">Build #$BUILD_NUM</div>\n</body>|" docs_new/index.html

          echo "✅ Build number and version info updated"

      - name: ✅ Verify Build
        if: github.event.inputs.skip_verification != 'true'
        run: |
          echo "Running build verification..."
          if [ -f ".github/scripts/verify-build.sh" ]; then
            ./.github/scripts/verify-build.sh docs_new
          else
            echo "⚠️ Warning: verify-build.sh script not found"
            echo "Performing basic verification..."
            
            if [ ! -f "docs_new/index.html" ]; then
              echo "❌ ERROR: index.html not found in build"
              exit 1
            fi
            
            if [ ! -d "docs_new/Build" ]; then
              echo "❌ ERROR: Build folder not found"
              exit 1
            fi
            
            echo "✅ Basic verification passed"
          fi

      - name: 💾 Create Backup Tag
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAG_NAME="backup/webgl-demo-$TIMESTAMP"

          echo "Creating backup tag: $TAG_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" -m "Backup before WebGL deployment - Build #${{ steps.download_build.outputs.build_number }}"
          git push origin "$TAG_NAME" || echo "⚠️ Warning: Could not push backup tag"

          echo "✅ Backup tag created: $TAG_NAME"

      - name: 🔄 Update docs/ Folder
        run: |
          echo "Replacing docs/ folder with new build..."

          if [ -d "docs" ]; then
            rm -rf docs/*
          else
            mkdir -p docs
          fi

          cp -r docs_new/* docs/

          rm -rf docs_new temp_build

          echo "✅ docs/ folder updated"

      - name: 📤 Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --staged --quiet; then
            echo "No changes to commit (build is identical)"
            echo "deployment_skipped=true" >> $GITHUB_ENV
          else
            git commit -m "chore: deploy WebGL demo from Unity Cloud Build #${{ steps.download_build.outputs.build_number }}

          Automated deployment via GitHub Actions
          - Build: #${{ steps.download_build.outputs.build_number }}
          - Workflow: ${{ github.workflow }}
          - Run: ${{ github.run_number }}"

            git push origin main

            echo "✅ Changes committed and pushed"
            echo "deployment_skipped=false" >> $GITHUB_ENV
          fi

      - name: ⏳ Wait for GitHub Pages
        if: env.deployment_skipped != 'true'
        run: |
          echo "Waiting 30 seconds for GitHub Pages to deploy..."
          sleep 30

      - name: 🌐 Verify GitHub Pages Deployment
        if: env.deployment_skipped != 'true'
        run: |
          PAGES_URL="https://joaofranciscopanta.github.io/sowur-shield/"

          echo "Checking GitHub Pages at: $PAGES_URL"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PAGES_URL")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ GitHub Pages is live and accessible"
          else
            echo "⚠️ Warning: GitHub Pages returned HTTP $HTTP_STATUS"
            echo "Deployment may still be processing. Check manually: $PAGES_URL"
          fi

      - name: 📊 Generate Summary
        if: always()
        run: |
          echo "## 🎮 WebGL Demo Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.download_build.outputs.download_success }}" = "true" ]; then
            echo "✅ **Build Downloaded**: Unity Cloud Build #${{ steps.download_build.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build Download Failed**" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ env.deployment_skipped }}" = "true" ]; then
            echo "⏭️ **Deployment**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ env.deployment_skipped }}" = "false" ]; then
            echo "✅ **Deployment**: Completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment**: Failed or incomplete" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Live Demo](https://joaofranciscopanta.github.io/sowur-shield/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Repository](https://github.com/Joaofranciscopanta/sowur-shield)" >> $GITHUB_STEP_SUMMARY
          echo "- [Unity Cloud Build](https://build.cloud.unity.com/)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Automated deployment completed at $(date)*" >> $GITHUB_STEP_SUMMARY

      - name: 📢 Discord Notification - Success
        if: success() && env.deployment_skipped != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ Discord webhook not configured, skipping notification"
            exit 0
          fi

          BUILD_NUM="${{ steps.download_build.outputs.build_number }}"
          DEPLOY_DATE=$(date +"%B %d, %Y at %H:%M UTC")

          DISCORD_PAYLOAD=$(cat <<EOF
          {
            "username": "Clucky (Release Manager)",
            "avatar_url": "https://i.imgur.com/OVBNa8C.png",
            "embeds": [{
              "title": "🎮 WebGL Demo Deployed Successfully!",
              "description": "We have a new Demo available!!",
              "color": 3066993,
              "fields": [
                {
                  "name": "🔢 Build Number",
                  "value": "#$BUILD_NUM",
                  "inline": true
                },
                {
                  "name": "📅 Deployed",
                  "value": "$DEPLOY_DATE",
                  "inline": true
                },
                {
                  "name": "🔗 Links",
                  "value": "[Give it a try](https://joaofranciscopanta.github.io/sowur-shield/) • [Repository](https://github.com/Joaofranciscopanta/sowur-shield) • [Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Automated build"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )

          curl -H "Content-Type: application/json" \
               -d "$DISCORD_PAYLOAD" \
               "$DISCORD_WEBHOOK_URL"

          echo "✅ Discord notification sent"

      - name: 📢 Discord Notification - Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ Discord webhook not configured, skipping notification"
            exit 0
          fi

          BUILD_NUM="${{ steps.download_build.outputs.build_number }}"
          FAIL_DATE=$(date +"%B %d, %Y at %H:%M UTC")

          DISCORD_PAYLOAD=$(cat <<EOF
          {
            "username": "Clucky",
            "avatar_url": "https://i.imgur.com/OVBNa8C.png",
            "embeds": [{
              "title": "❌ WebGL Deployment Failed",
              "description": "The automated deployment encountered an error.",
              "color": 15158332,
              "fields": [
                {
                  "name": "🔢 Build Number",
                  "value": "#$BUILD_NUM",
                  "inline": true
                },
                {
                  "name": "📅 Failed At",
                  "value": "$FAIL_DATE",
                  "inline": true
                },
                {
                  "name": "🔗 Debug",
                  "value": "[View Workflow Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Check workflow logs for details"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )

          curl -H "Content-Type: application/json" \
               -d "$DISCORD_PAYLOAD" \
               "$DISCORD_WEBHOOK_URL"

          echo "✅ Discord failure notification sent"

  rollback:
    name: Rollback to Previous Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback == 'true'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: ↩️ Rollback to Previous Tag
        run: |
          echo "Finding latest backup tag..."
          LATEST_BACKUP=$(git tag -l "backup/webgl-demo-*" | sort -r | head -1)

          if [ -z "$LATEST_BACKUP" ]; then
            echo "❌ Error: No backup tags found"
            exit 1
          fi

          echo "Rolling back to: $LATEST_BACKUP"

          git checkout "$LATEST_BACKUP" -- docs/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/
          git commit -m "chore: rollback WebGL demo to $LATEST_BACKUP"
          git push origin main

          echo "✅ Rollback completed"
