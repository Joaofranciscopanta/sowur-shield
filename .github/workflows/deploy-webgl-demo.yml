name: Deploy WebGL to GitHub Pages

on:
  # Any game-content push to main triggers a fresh Unity Cloud Build + deploy.
  # docs/** is deliberately excluded so the workflow's own deploy commit
  # (and landing-page-only edits) never trigger a Unity rebuild.
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unity build number (leave empty for latest)'
        required: false
        type: string
      trigger_new_build:
        description: 'Trigger a brand new Unity Cloud Build before deploying'
        required: false
        type: boolean
        default: false
      diagnose_build:
        description: 'Build number to diagnose (prints status+log, skips deploy)'
        required: false
        type: string

# Serialize runs: a push that lands while a deploy is running waits its turn
# (intermediate queued runs are superseded, only the newest queued run executes).
concurrency:
  group: deploy-webgl-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Diagnose Build
        if: ${{ github.event.inputs.diagnose_build != '' }}
        env:
          UNITY_API_KEY: ${{ secrets.UNITY_API_KEY }}
          UNITY_ORG_ID: ${{ secrets.UNITY_ORG_ID }}
          UNITY_PROJECT_ID: ${{ secrets.UNITY_PROJECT_ID }}
          UNITY_BUILD_TARGET_ID: ${{ secrets.UNITY_BUILD_TARGET_ID }}
        run: |
          ENCODED_KEY=$(echo -n "$UNITY_API_KEY:" | base64)
          BUILD_NUMBER="${{ github.event.inputs.diagnose_build }}"
          echo "--- Build #$BUILD_NUMBER details ---"
          curl -s -H "Authorization: Basic $ENCODED_KEY" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${UNITY_BUILD_TARGET_ID}/builds/${BUILD_NUMBER}"
          echo ""
          echo "--- Build #$BUILD_NUMBER log ---"
          curl -s -H "Authorization: Basic $ENCODED_KEY" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${UNITY_BUILD_TARGET_ID}/builds/${BUILD_NUMBER}/log"

      - name: Trigger New Unity Cloud Build
        id: trigger
        if: ${{ github.event_name == 'push' || github.event.inputs.trigger_new_build == 'true' }}
        env:
          UNITY_API_KEY: ${{ secrets.UNITY_API_KEY }}
          UNITY_ORG_ID: ${{ secrets.UNITY_ORG_ID }}
          UNITY_PROJECT_ID: ${{ secrets.UNITY_PROJECT_ID }}
          UNITY_BUILD_TARGET_ID: ${{ secrets.UNITY_BUILD_TARGET_ID }}
        run: |
          ENCODED_KEY=$(echo -n "$UNITY_API_KEY:" | base64)

          echo "🚀 Starting a new Unity Cloud Build..."
          START_RESPONSE=$(curl -s -X POST -H "Authorization: Basic $ENCODED_KEY" -H "Content-Type: application/json" \
            -d '{"clean": false, "delay": 0}' \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${UNITY_BUILD_TARGET_ID}/builds")

          NEW_BUILD_NUMBER=$(echo "$START_RESPONSE" | grep -o '"build":[0-9]*' | head -1 | cut -d':' -f2)
          [ -z "$NEW_BUILD_NUMBER" ] && echo "❌ Could not start new build: $START_RESPONSE" && exit 1
          echo "✅ Started build #$NEW_BUILD_NUMBER — polling for completion..."

          # Poll every 30s for up to 45 minutes (covers time queued behind
          # another Cloud Build plus the WebGL build itself)
          for i in $(seq 1 90); do
            sleep 30
            STATUS_INFO=$(curl -s -H "Authorization: Basic $ENCODED_KEY" \
              "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${UNITY_BUILD_TARGET_ID}/builds/${NEW_BUILD_NUMBER}")
            STATUS=$(echo "$STATUS_INFO" | grep -o '"buildStatus":"[^"]*"' | head -1 | cut -d':' -f2 | tr -d '"')
            echo "  ⏳ [$i/90] Build #$NEW_BUILD_NUMBER status: $STATUS"

            if [ "$STATUS" = "success" ]; then
              echo "✅ Build #$NEW_BUILD_NUMBER succeeded!"
              echo "build_number=$NEW_BUILD_NUMBER" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "canceled" ]; then
              echo "❌ Build #$NEW_BUILD_NUMBER ended with status: $STATUS"
              echo "--- Build details ---"
              echo "$STATUS_INFO"
              echo "--- Build log entries ---"
              curl -s -H "Authorization: Basic $ENCODED_KEY" \
                "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${UNITY_BUILD_TARGET_ID}/builds/${NEW_BUILD_NUMBER}/log" || true
              exit 1
            fi
          done

          echo "❌ Timed out waiting for build #$NEW_BUILD_NUMBER to complete"
          exit 1

      - name: Download Unity Build
        id: download
        env:
          UNITY_API_KEY: ${{ secrets.UNITY_API_KEY }}
          UNITY_ORG_ID: ${{ secrets.UNITY_ORG_ID }}
          UNITY_PROJECT_ID: ${{ secrets.UNITY_PROJECT_ID }}
          UNITY_BUILD_TARGET_ID: ${{ secrets.UNITY_BUILD_TARGET_ID }}
        run: |
          echo "Downloading Unity Cloud Build..."
          mkdir -p temp_build
          ENCODED_KEY=$(echo -n "$UNITY_API_KEY:" | base64)

          BUILD_NUMBER="${{ steps.trigger.outputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_INFO=$(curl -s -H "Authorization: Basic $ENCODED_KEY" \
              "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${UNITY_BUILD_TARGET_ID}/builds?per_page=1&buildStatus=success")
            BUILD_NUMBER=$(echo "$BUILD_INFO" | grep -o '"build":[0-9]*' | head -1 | cut -d':' -f2)
            [ -z "$BUILD_NUMBER" ] && echo "❌ Could not fetch build number" && exit 1
            echo "✅ Latest successful build: #$BUILD_NUMBER"
          fi

          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          
          # Unity flips buildStatus to "success" BEFORE the artifact upload finishes,
          # so download_primary can still be absent for a minute or two. Poll for it
          # instead of failing on the first miss (this killed build #45's deploy).
          DOWNLOAD_URL=""
          for i in $(seq 1 20); do
            DOWNLOAD_INFO=$(curl -s -H "Authorization: Basic $ENCODED_KEY" \
              "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/${UNITY_BUILD_TARGET_ID}/builds/${BUILD_NUMBER}")

            DOWNLOAD_URL=$(echo "$DOWNLOAD_INFO" | grep -o '"download_primary"[^}]*"href":"[^"]*"' | grep -o 'https://[^"]*' | head -1)
            [ -n "$DOWNLOAD_URL" ] && break

            echo "  ⏳ [$i/20] Artifact for build #$BUILD_NUMBER not published yet, waiting 30s..."
            sleep 30
          done

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ Could not fetch download URL for build #$BUILD_NUMBER after 10 minutes"
            echo "--- Build details ---"
            echo "$DOWNLOAD_INFO"
            exit 1
          fi

          curl -fL "$DOWNLOAD_URL" -o temp_build/webgl-build.zip
          echo "✅ Build downloaded successfully"

      - name: Extract Build
        run: |
          unzip -q temp_build/webgl-build.zip -d docs_new
          
          if [ -d "docs_new/Default WebGL" ]; then
            mv "docs_new/Default WebGL"/* docs_new/
            rmdir "docs_new/Default WebGL"
          elif [ -d "docs_new/WebGL" ]; then
            mv docs_new/WebGL/* docs_new/
            rmdir docs_new/WebGL
          fi
          
          [ ! -d "docs_new/Build" ] && echo "❌ Build directory not found" && exit 1
          echo "✅ Build extracted successfully"

      - name: Decompress Brotli Files
        run: |
          echo "Checking for Brotli-compressed build files..."
          sudo apt-get update -qq
          sudo apt-get install -y brotli

          BR_FILES=$(find docs_new/Build -name "*.br" -type f)
          if [ -n "$BR_FILES" ]; then
            echo "Found Brotli files, decompressing for GitHub Pages compatibility..."
            while IFS= read -r BR_FILE; do
              DECOMPRESSED_FILE="${BR_FILE%.br}"
              echo "  Decompressing: $(basename "$BR_FILE") -> $(basename "$DECOMPRESSED_FILE")"
              brotli -d -f "$BR_FILE" -o "$DECOMPRESSED_FILE"
              rm "$BR_FILE"
            done < <(find docs_new/Build -name "*.br" -type f)
            echo "✅ All Brotli files decompressed successfully"
          else
            echo "ℹ️  No Brotli files found, build is already uncompressed or uses gzip"
          fi

          # Unity's loader.js may still reference the .br extensions in its
          # compression config even after we've decompressed the files on disk.
          if [ -f "docs_new/Build/Default WebGL.loader.js" ]; then
            sed -i 's/\.data\.br/.data/g; s/\.wasm\.br/.wasm/g; s/\.framework\.js\.br/.framework.js/g' "docs_new/Build/Default WebGL.loader.js"
          fi

      - name: Backup Custom Files
        run: |
          echo "📦 Backing up custom files..."
          mkdir -p custom_backup/TemplateData
          
          # Backup custom HTML
          if [ -f "docs/index.html" ]; then
            cp docs/index.html custom_backup/index.html
            echo "✅ index.html backed up"
          fi
          
          # Backup custom CSS
          if [ -f "docs/TemplateData/style.css" ]; then
            cp docs/TemplateData/style.css custom_backup/TemplateData/style.css
            echo "✅ style.css backed up"
          fi

          # Backup every hand-written page beside index.html (privacy, terms,
          # cookies) and their shared stylesheet. Same trap as the Markdown docs
          # below: `rm -rf docs` destroys anything not backed up here, and these
          # are LEGAL pages - losing them silently is not acceptable.
          html_count=0
          for f in docs/*.html; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            # index.html is backed up separately above. Note: an `&& continue`
            # here would be the last command of the loop body, and GitHub runs
            # `bash -e`, so a false test would abort the whole step.
            if [ "$base" != "index.html" ]; then
              cp "$f" "custom_backup/$base"
              html_count=$((html_count + 1))
            fi
          done
          echo "✅ $html_count extra HTML page(s) backed up"

          if [ -f "docs/legal.css" ]; then
            cp docs/legal.css custom_backup/legal.css
            echo "✅ legal.css backed up"
          fi

          # Backup custom assets (landing page images, etc.)
          if [ -d "docs/assets" ]; then
            cp -r docs/assets custom_backup/assets
            echo "✅ assets/ backed up"
          fi

          # Backup every top-level Markdown doc, not just README.md. The deploy step
          # does `rm -rf docs`, so anything not backed up here is destroyed: this
          # silently deleted PLACEHOLDER_ASSET_BRIEF.md and COMBAT_ACTIVE_PAUSE_DESIGN.md
          # on three separate deploys before the cause was tracked down.
          mkdir -p custom_backup/md
          md_count=0
          for f in docs/*.md; do
            [ -e "$f" ] || continue
            cp "$f" "custom_backup/md/$(basename "$f")"
            md_count=$((md_count + 1))
          done
          echo "✅ $md_count Markdown file(s) backed up"

      - name: Create Backup Tag
        run: |
          BACKUP_TAG="backup/webgl-demo-$(date +%Y%m%d-%H%M%S)"
          git tag "$BACKUP_TAG"
          git push origin "$BACKUP_TAG"
          echo "✅ Backup tag created: $BACKUP_TAG"

      - name: Deploy to GitHub Pages
        run: |
          [ -d "docs" ] && rm -rf docs
          mv docs_new docs
          
          echo "🔄 Restoring custom files..."
          
          # Restore custom HTML
          if [ -f "custom_backup/index.html" ]; then
            cp custom_backup/index.html docs/index.html
            echo "✅ Custom index.html restored"
          fi
          
          # Restore custom CSS
          if [ -f "custom_backup/TemplateData/style.css" ]; then
            mkdir -p docs/TemplateData
            cp custom_backup/TemplateData/style.css docs/TemplateData/style.css
            echo "✅ Custom CSS restored"
          fi

          # Restore the legal pages and their stylesheet.
          html_count=0
          for f in custom_backup/*.html; do
            [ -e "$f" ] || continue
            cp "$f" "docs/$(basename "$f")"
            html_count=$((html_count + 1))
          done
          echo "✅ $html_count extra HTML page(s) restored"

          if [ -f "custom_backup/legal.css" ]; then
            cp custom_backup/legal.css docs/legal.css
            echo "✅ legal.css restored"
          fi

          # Restore custom assets (landing page images, etc.)
          if [ -d "custom_backup/assets" ]; then
            rm -rf docs/assets
            cp -r custom_backup/assets docs/assets
            echo "✅ Custom assets restored"
          fi

          # Restore every Markdown doc backed up above.
          if [ -d "custom_backup/md" ]; then
            md_count=0
            for f in custom_backup/md/*.md; do
              [ -e "$f" ] || continue
              cp "$f" "docs/$(basename "$f")"
              md_count=$((md_count + 1))
            done
            echo "✅ $md_count Markdown file(s) restored"
          fi

          # Write build metadata consumed by the landing page badge (index.html).
          # If the build number hasn't changed, keep the previous file so the
          # original deploy date is preserved and no spurious commit is created.
          BUILD_NUM="${{ steps.download.outputs.build_number }}"
          PREV_BUILD=$(git show HEAD:docs/build-info.json 2>/dev/null | grep -o '"build": *[0-9]*' | grep -o '[0-9]*' || true)
          if [ -n "$BUILD_NUM" ] && [ "$PREV_BUILD" != "$BUILD_NUM" ]; then
            printf '{"build": %s, "deployedAt": "%s"}\n' "$BUILD_NUM" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/build-info.json
            echo "✅ build-info.json written (build #$BUILD_NUM)"
          elif [ -n "$PREV_BUILD" ]; then
            git show HEAD:docs/build-info.json > docs/build-info.json
            echo "ℹ️ Build number unchanged (#$PREV_BUILD) — keeping existing build-info.json"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/
          if git diff --staged --quiet; then
            echo "ℹ️ No changes from Unity build #${{ steps.download.outputs.build_number }} — nothing to deploy"
          else
            git commit -m "🎮 Deploy WebGL Build #${{ steps.download.outputs.build_number }}

          - Unity Cloud Build: #${{ steps.download.outputs.build_number }}
          - Deployed: $(date -u +"%Y-%m-%d %H:%M UTC")
          - Custom files preserved
          - Automated deployment via GitHub Actions"

            # A commit may have landed on main while the Unity build ran —
            # rebase our docs-only commit on top of it before pushing.
            git pull --rebase origin main
            git push origin main

            echo "✅ Deployed!"
          fi

      - name: Discord Notification (Success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook not configured"
            exit 0
          fi
          
          BUILD_NUM="${{ steps.download.outputs.build_number }}"
          DEPLOY_DATE=$(date +"%B %d, %Y at %H:%M UTC")
          
          DISCORD_PAYLOAD=$(cat <<EOF
          {
            "username": "Clucky",
            "avatar_url": "https://i.imgur.com/OVBNa8C.png",
            "embeds": [{
              "title": "✅ WebGL Demo Updated!",
              "description": "A fresh build just landed from Unity Cloud! 🎮",
              "color": 5763719,
              "fields": [
                {
                  "name": "🔢 Build Number",
                  "value": "#$BUILD_NUM",
                  "inline": true
                },
                {
                  "name": "📅 Deployed At",
                  "value": "$DEPLOY_DATE",
                  "inline": true
                },
                {
                  "name": "🎯 Status",
                  "value": "Live and ready to play!",
                  "inline": false
                },
                {
                  "name": "🔗 Play Now",
                  "value": "[Launch Demo](https://joaofranciscopanta.github.io/sowur-shield/) • [Repository](https://github.com/Joaofranciscopanta/sowur-shield)",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Automated deployment via GitHub Actions • Sowur Shield"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )
          
          curl -H "Content-Type: application/json" \
               -d "$DISCORD_PAYLOAD" \
               "$DISCORD_WEBHOOK_URL"
          
          echo "✅ Clucky notified the team!"

      - name: Discord Notification (Failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            exit 0
          fi
          
          BUILD_NUM="${{ steps.download.outputs.build_number }}"
          FAIL_DATE=$(date +"%B %d, %Y at %H:%M UTC")
          
          DISCORD_PAYLOAD=$(cat <<EOF
          {
            "username": "Clucky",
            "avatar_url": "https://i.imgur.com/OVBNa8C.png",
            "embeds": [{
              "title": "❌ Deployment Failed!",
              "description": "Something went wrong with the WebGL deployment. Time to investigate! 🔍",
              "color": 15158332,
              "fields": [
                {
                  "name": "🔢 Build Number",
                  "value": "#$BUILD_NUM",
                  "inline": true
                },
                {
                  "name": "📅 Failed At",
                  "value": "$FAIL_DATE",
                  "inline": true
                },
                {
                  "name": "🔧 Action Required",
                  "value": "Check the workflow logs to see what went wrong.",
                  "inline": false
                },
                {
                  "name": "🔗 Debug",
                  "value": "[View Workflow Logs](https://github.com/Joaofranciscopanta/sowur-shield/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "GitHub Actions Deployment • Needs attention"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )
          
          curl -H "Content-Type: application/json" \
               -d "$DISCORD_PAYLOAD" \
               "$DISCORD_WEBHOOK_URL"
